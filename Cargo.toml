[workspace]
resolver = "3"
members = ["crates/jt128", "crates/lio-core", "crates/lio"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-2.0-only"
publish = false

[workspace.dependencies]
jt128 = { path = "crates/jt128" }
lio-core = { path = "crates/lio-core" }
nix = { version = "0.31", default-features = false, features = ["sched"] }
rayon = "1.12"
sha2 = { version = "0.11", default-features = false }
serde_json = { version = "1.0", features = ["float_roundtrip"] }

[workspace.lints.rust]
unsafe_code = "forbid"
